name: Remove prereleases

# One-off: deletes the three 0.1.17 development prereleases (the releases only, not the tags).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in v0.1.17-dev1 v0.1.17-dev2 v0.1.17-dev3; do
            is_pre="$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo missing)"
            if [ "$is_pre" = "true" ]; then
              gh release delete "$tag" --yes
              echo "deleted $tag"
            else
              echo "skip $tag ($is_pre)"
            fi
          done
